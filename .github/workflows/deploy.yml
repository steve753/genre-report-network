name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Refuse to deploy a tree that fails its own checks (2026-10-03, Steve). The suite is offline and needs no
      # npm install: it reads public/, config/ and src/ and builds a page in a temp folder. A failure here stops
      # both automated routes to the live site: a push to main, and the publish job, which dispatches this
      # workflow and waits for it before recording the issue as published. A wrangler deploy run by hand skips it.
      - name: Site and runner self-tests (refuse to deploy a broken tree)
        run: node runner/test/run-tests.mjs

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"

      # Worker runtime secrets are set once (or when rotated) via:
      #   wrangler secret put SUPABASE_URL / SUPABASE_SERVICE_KEY / POSTMARK_TOKEN / DOI_SIGNING_SECRET
      # or in the Cloudflare dashboard under Workers → genre-reports → Settings → Variables.
