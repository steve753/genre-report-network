# Genre Report Network — unattended issue production (DR-0168).
# Two jobs, one human gate between them:
#   produce  — runs the ruled pipeline on the Polymath API account and uploads
#              review artifacts (draft, adversary reports, layout check,
#              screenshots, summary). It holds NO write credential of any
#              kind: contents:read, no persisted git token, and the database
#              token appears only in the prepare step, which runs BEFORE any
#              agent seat. The pages it builds are previews for the
#              screenshots — nothing from its working tree ships.
#   publish  — bound to the "production" GitHub environment, whose REQUIRED
#              REVIEWER is Steve (DR-0158: a production environment gate with
#              required approval guards every deploy; ungated auto-deploy is
#              prohibited). His approval starts a FRESH machine that rebuilds
#              the shipping pages deterministically from the approved draft
#              using HEAD code and HEAD chrome, commits exactly those pages to
#              main, dispatches the deploy, smoke-tests, records publication
#              through the write lane, and triggers the one-click review
#              email. Nothing in either job can send mail — that remains
#              Steve's click (DR-0165). Because the publish machine shares
#              nothing with the seats (no filesystem, no env, no git state), a
#              prompt-injected seat has no path to the site or the database.
#
# The monthly schedule is written in but INERT until the repo variable
# RUNNER_SCHEDULE_ENABLED is set to 'true' (arming is Steve's act in the
# GitHub UI, after the thriller shakedown passes — DR-0168).
#
# Secrets (Steve sets these in Settings → Secrets; they never pass through a
# Claude session): ANTHROPIC_API_KEY, SUPABASE_ANON_KEY, RUNNER_DB_TOKEN,
# WRITE_LANE_URL. Variables: SUPABASE_URL, MODEL_RESEARCH, MODEL_WRITER,
# MODEL_ADVERSARY, MODEL_MECHANICAL, RUNNER_SCHEDULE_ENABLED, ROUNDS_MAX,
# SEAT_OUTPUT_TOKEN_CAP.

name: Produce Issue

on:
  workflow_dispatch:
    inputs:
      genre:
        description: "Genre slug (config/genres.json)"
        required: true
      month:
        description: "Issue month as YYYY-MM-01 (default: current month)"
        required: false
      allow_stale_pack:
        description: "Proceed on a stale data pack (deliberate override)"
        type: boolean
        default: false
  schedule:
    - cron: "30 6 1 * *" # 06:30 UTC on the 1st; pg_cron pulls data packs at 05:30

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.RUNNER_SCHEDULE_ENABLED == 'true'
    outputs:
      genres: ${{ steps.plan.outputs.genres }}
      month: ${{ steps.plan.outputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: plan
        env:
          INPUT_GENRE: ${{ github.event.inputs.genre }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          MONTH="$INPUT_MONTH"
          if [ -z "$MONTH" ]; then MONTH="$(date -u +%Y-%m-01)"; fi
          if ! echo "$MONTH" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])-01$'; then
            echo "month input must be YYYY-MM-01, got: $MONTH" && exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GENRES=$(node --input-type=module -e '
              import fs from "node:fs";
              const cfg = JSON.parse(fs.readFileSync("config/genres.json", "utf8"));
              const slug = process.env.INPUT_GENRE;
              if (!cfg.genres.some((g) => g.slug === slug)) {
                console.error(`unknown genre slug: ${slug}`);
                process.exit(1);
              }
              console.log(JSON.stringify([slug]));
            ')
          else
            GENRES=$(node --input-type=module -e '
              import fs from "node:fs";
              const { genresDue } = await import("./runner/lib/util.mjs");
              const cfg = JSON.parse(fs.readFileSync("config/genres.json", "utf8"));
              console.log(JSON.stringify(genresDue(cfg, process.argv[1])));
            ' "$MONTH")
          fi
          echo "genres=$GENRES" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "Plan: $GENRES for $MONTH"

  produce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read # this job can ship NOTHING — the gated publish job rebuilds and commits
    concurrency:
      group: produce-${{ matrix.genre }}
      cancel-in-progress: false
    strategy:
      fail-fast: false # single-genre failures never block the batch (failure policy)
      max-parallel: 1
      matrix:
        genre: ${{ fromJSON(needs.plan.outputs.genres) }}
    env:
      GENRE: ${{ matrix.genre }}
      MONTH: ${{ needs.plan.outputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SECURITY: agent seats run bash and fetch untrusted web pages. With
          # no persisted credential and contents:read, a prompt-injected seat
          # holds no token that could push or dispatch anything.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runner deps
        run: cd runner && npm install --no-audit --no-fund
      - name: Prepare (database credentials; runs BEFORE any seat)
        id: prepare
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RUNNER_DB_TOKEN: ${{ secrets.RUNNER_DB_TOKEN }}
          ALLOW_STALE: ${{ github.event.inputs.allow_stale_pack }}
        run: |
          FLAGS=""
          if [ "$ALLOW_STALE" = "true" ]; then FLAGS="--allow-stale-pack"; fi
          set +e
          node runner/produce-issue.mjs --phase=prepare "--genre=$GENRE" "--month=$MONTH" $FLAGS
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then echo "outcome=skipped" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CODE" != "0" ]; then echo "outcome=failed" >> "$GITHUB_OUTPUT"; exit "$CODE"; fi
          echo "outcome=ok" >> "$GITHUB_OUTPUT"
      - name: Run seats (API key only; runner file-command channels neutralized)
        id: seats
        if: steps.prepare.outputs.outcome == 'ok'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_RESEARCH: ${{ vars.MODEL_RESEARCH }}
          MODEL_WRITER: ${{ vars.MODEL_WRITER }}
          MODEL_ADVERSARY: ${{ vars.MODEL_ADVERSARY }}
          MODEL_MECHANICAL: ${{ vars.MODEL_MECHANICAL }}
          ROUNDS_MAX: ${{ vars.ROUNDS_MAX }}
          SEAT_OUTPUT_TOKEN_CAP: ${{ vars.SEAT_OUTPUT_TOKEN_CAP }}
        run: |
          # Point the runner's file-command channels at /dev/null for the seat
          # process tree, so an injected seat cannot set env/PATH for later
          # steps through the runner's own file-command mechanism. This is a
          # belt, not the control: the control is that nothing that ships or
          # writes runs later in this job at all.
          export GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_STATE=/dev/null
          node runner/produce-issue.mjs --phase=seats "--genre=$GENRE" "--month=$MONTH"
      - name: Upload review artifacts (public repo — never K-lytics material; on a containment hit the guard quarantines the whole artifact set first)
        # The shippable artifact NAME exists only when the seats step actually
        # succeeded — a failed run's summary (or a seat-forged one) uploads
        # under failed-*, which the publish gate never downloads. This is what
        # makes summary.json trustworthy proof that verification ran.
        if: always() && steps.prepare.outputs.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.seats.outcome == 'success' && format('issue-{0}-{1}', matrix.genre, needs.plan.outputs.month) || format('failed-issue-{0}-{1}', matrix.genre, needs.plan.outputs.month) }}
          path: runner/workspace/${{ matrix.genre }}-${{ needs.plan.outputs.month }}/public-artifacts/
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

  publish:
    needs: [plan, produce]
    # A failed sibling desk must not block the desks that produced cleanly
    # (failure policy): run as long as the plan succeeded and produce ran.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.produce.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: production # REQUIRED REVIEWER: Steve. This pause IS the deploy gate (DR-0158).
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        genre: ${{ fromJSON(needs.plan.outputs.genres) }}
    env:
      GENRE: ${{ matrix.genre }}
      MONTH: ${{ needs.plan.outputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the retry guard greps history; a shallow clone would see only the tip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download this genre's artifact (absent = that desk did not produce; skip)
        id: art
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: issue-${{ matrix.genre }}-${{ needs.plan.outputs.month }}
          path: artifacts
      - name: Decide whether this desk ships
        id: gate
        run: |
          if [ ! -f artifacts/summary.json ] || [ ! -f artifacts/draft.md ]; then
            echo "ship=false (no reviewed draft artifact)"; echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OK=$(node --input-type=module -e '
            import fs from "node:fs";
            const { shippableSummary } = await import("./runner/lib/util.mjs");
            const s = JSON.parse(fs.readFileSync("artifacts/summary.json", "utf8"));
            console.log(shippableSummary(s) ? "true" : "false");
          ')
          echo "ship=$OK" >> "$GITHUB_OUTPUT"
          echo "ship=$OK"
      - name: Rebuild pages from the approved draft and push to main
        if: steps.gate.outputs.ship == 'true'
        run: |
          git config user.name "genre-report-runner"
          git config user.email "reports@stevepieper.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            # A push that reached the server but reported failure (dropped
            # connection) shows up here as our commit already on origin/main:
            # treat as done so the deploy and record steps still run.
            if git log -5 --oneline --grep "Publish $GENRE issue for $MONTH" | grep -q .; then
              echo "publish commit already on main — continuing to deploy/record"
              exit 0
            fi
            OUT=$(node runner/build-pages.mjs artifacts/draft.md "--genre=$GENRE" "--month=$MONTH")
            echo "$OUT"
            echo "$OUT" | node --input-type=module -e '
              import fs from "node:fs";
              import { execFileSync } from "node:child_process";
              const chunks = []; process.stdin.on("data", (c) => chunks.push(c));
              process.stdin.on("end", () => {
                const out = JSON.parse(chunks.join(""));
                if (!Array.isArray(out.written) || out.written.length === 0) { console.error("build wrote nothing"); process.exit(1); }
                for (const p of out.written) {
                  if (!/^public\/[a-z0-9/._-]+$/.test(p) || p.split("/").includes("..")) { console.error(`suspicious path: ${p}`); process.exit(1); }
                  execFileSync("git", ["add", "--", p], { stdio: "inherit" });
                }
                const dirty = execFileSync("git", ["status", "--porcelain", "--", "public/"]).toString().split("\n")
                  .filter((l) => l.trim() && !/^[AM] /.test(l));
                if (dirty.length) { console.error("unexpected changes under public/:\n" + dirty.join("\n")); process.exit(1); }
              });
            '
            if git diff --cached --quiet; then echo "nothing to commit — pages already current"; exit 0; fi
            git commit -m "Publish $GENRE issue for $MONTH (runner; approved via production environment gate)"
            if git push origin main; then exit 0; fi
            echo "push rejected (main advanced); retrying"
            git reset --hard origin/main
          done
          echo "could not push after 3 attempts" && exit 1
      - name: Dispatch deploy and wait for THAT run (bot pushes do not auto-trigger workflows)
        if: steps.gate.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark taken 60s in the past so runner/API clock skew cannot hide
          # the dispatched run from the createdAt filter.
          MARK=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          BEFORE_ID=$(gh run list --workflow=deploy.yml --branch=main --limit=1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run deploy.yml --ref main
          RUN_ID=""
          for i in $(seq 1 12); do
            sleep 10
            RUN_ID=$(gh run list --workflow=deploy.yml --branch=main --limit=5 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$MARK\" and .databaseId != $BEFORE_ID)] | first | .databaseId // empty")
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then echo "dispatched deploy run never appeared" && exit 1; fi
          echo "watching deploy run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
      - name: Register draft row, record publication, notify approver
        if: steps.gate.outputs.ship == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RUNNER_DB_TOKEN: ${{ secrets.RUNNER_DB_TOKEN }}
          WRITE_LANE_URL: ${{ secrets.WRITE_LANE_URL }}
        run: node runner/publish-issue.mjs artifacts/summary.json
