<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex"><!-- a confirmation step, never a search result: stays noindex after launch -->
<title>Almost there — Thriller Monthly</title>
<style>
  :root{
    --mast:#12151a; --mast-ink:#f5f2ea; --paper:#faf8f4; --ink:#1c1c1c; --ink-2:#444;
    --accent:#a31621; --accent-dark:#7e1019; --muted:#857e72; --gold:#c1932b;
    --rule:#e5e1d8; --col:42rem;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
       color:var(--ink);background:var(--paper);line-height:1.7;font-size:1.05rem}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
  a:hover{color:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:4px;
       padding:.45rem .9rem;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--accent-dark);color:#fff}

  /* ---------- masthead hero (identical to the report page) ---------- */
  .masthead{background:var(--mast);color:var(--mast-ink);padding:2.2rem 1.2rem 2.4rem;text-align:center;
            border-bottom:2px solid var(--gold)}
  .masthead h1{margin:0;font-size:2rem;letter-spacing:.28em;font-weight:800}
  .masthead .tag{font-style:italic;opacity:.85;margin:.4rem 0 1.2rem}
  .capture{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
  .capture input{padding:.55rem .8rem;border-radius:4px;border:1px solid #3a414b;
    background:#fff;color:var(--ink);font-size:.95rem}
  .capture input[type=email]{min-width:16rem}
  .capture input[type=text]{min-width:10rem}
  .masthead .cadence{font-style:italic;opacity:.8;font-size:.9rem;margin-top:.8rem}

  /* ---------- body ---------- */
  main{max-width:var(--col);margin:0 auto;padding:2.6rem 1.2rem 3.5rem}
  h2{font-size:1.3rem;margin:0 0 1rem;letter-spacing:.02em}
  ul.what{margin:0 0 1.4rem 1.2rem;padding:0}
  ul.what li{margin:.6rem 0}
  .promise{margin:0 0 1.8rem}
  .firstissue{margin:0 0 2.2rem}
  .fineprint{font-size:.85rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:1.2rem}

  /* ---------- confirmation step ---------- */
  .confirm{text-align:center}
  .masthead .brandname{margin:0;font-size:2rem;letter-spacing:.28em;font-weight:800;line-height:1.3}
  .confirm h1{font-size:2rem;margin:0 0 1rem;letter-spacing:.01em}
  .confirm .sub{font-size:1.2rem;margin:0 0 1.4rem}
  .confirm .note{color:var(--ink-2);margin:0}
</style>
</head>
<body>

<header class="masthead">
  <div class="brandname">THRILLER MONTHLY</div>
  <p class="tag">The business of suspense, for the authors who write it.</p>
</header>

<main class="confirm">
  <h1>Almost there!</h1>
  <p class="sub">Please check your inbox to confirm your subscription to Steve Pieper's Genre Report.</p>
  <p class="note">If the email doesn't arrive within 3 minutes, please check your spam folder(s).</p>
</main>

</body>
</html>
